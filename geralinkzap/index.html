<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Link WhatsApp | Premium</title>
    <meta name="description" content="Crie links de WhatsApp personalizados com mensagens formatadas de forma rápida e segura. Grátis e fácil de usar.">
    <meta name="keywords" content="whatsapp, gerador de link, link personalizado, marketing, vendas" />
    <meta name="author" content="Alexandre" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://midiadsj.com/geralinkzap/" />
    <meta property="og:title" content="Gerador de Link WhatsApp | Premium" />
    <meta property="og:description" content="Crie links de WhatsApp personalizados com mensagens formatadas rapidamente." />
    <meta property="og:image" content="https://midiadsj.com/images/gerador.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://midiadsj.com/geralinkzap/" />
    <meta property="twitter:title" content="Gerador de Link WhatsApp | Premium" />
    <meta property="twitter:description" content="Crie links de WhatsApp personalizados com mensagens formatadas rapidamente." />
    <meta property="twitter:image" content="https://midiadsj.com/images/gerador.png" />

    <link rel="canonical" href="https://midiadsj.com/geralinkzap/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=1.0.1">

</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
            </div>
            <div class="header-text">
                <h1>Gerador de Link WhatsApp</h1>
                <p>Crie links personalizados para WhatsApp gratuitamente</p>
            </div>
        </header>

        <main class="card">
            <div class="form-grid">
                <div class="form-group">
                    <label for="phone">Número WhatsApp <span>*</span></label>
                    <div class="input-wrapper">
                        <input type="tel" id="phone" placeholder="+55 (11) 99999-9999" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">Email (opcional)</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" placeholder="seu@email.com">
                    </div>
                </div>
            </div>

            <div class="form-group mt-4">
                <label>Mensagem Personalizada (opcional)</label>
                <div class="toolbar">
                    <button type="button" class="btn-tool" data-format="bold" title="Negrito">
                        <span class="tool-icon">B</span> Negrito
                    </button>
                    <button type="button" class="btn-tool" data-format="italic" title="Itálico">
                        <span class="tool-icon italic">I</span> Itálico
                    </button>
                    <button type="button" class="btn-tool" data-format="strike" title="Tachado">
                        <span class="tool-icon strike">S</span> Tachado
                    </button>
                    <button type="button" class="btn-tool" data-format="code" title="Código">
                        <span class="tool-icon code">&lt;&gt;</span> Código
                    </button>
                </div>
                <div class="input-wrapper">
                    <textarea id="message" placeholder="Olá! Gostaria de saber mais sobre..." rows="4"></textarea>
                </div>
            </div>

            <button type="button" id="generate-btn" class="btn-primary">
                Gerar Link WhatsApp
            </button>

            <div id="result-container" class="result-card hidden">
                <div class="result-header">
                    <h3>Seu link está pronto!</h3>
                </div>
                <div class="result-body">
                    <input type="text" id="result-url" readonly>
                    <button type="button" id="copy-btn" class="btn-secondary">Copiar</button>
                </div>
            </div>
        </main>

        <section class="featured-tool">
            <div class="promo-card">
                <div class="promo-image">
                    <img src="../images/qrcode.png" alt="Gerador de QR Code">
                </div>
                <div class="promo-content">
                    <span class="badge">Destaque</span>
                    <h3>Conheça também: Gerador de QR Code</h3>
                    <p>Crie códigos QR rápido, fácil e grátis.</p>
                    <a href="../qrcode/" class="btn-promo">Acessar Ferramenta</a>
                </div>
            </div>
        </section>

        <footer class="footer">
            <p>&copy; 2026 GeralinkZap • Desenvolvido com Antigravity</p>
        </footer>

    </div>

    <!-- Feedback Toast -->
    <div id="toast" class="toast hidden">Copiado com sucesso!</div>

    <script src="main.js?v=1.0.1"></script>

</body>
</html>
