<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de QR Code Premium</title>
    <meta
      name="description"
      content="Crie códigos QR dinâmicos, vibrantes e personalizados para seus links, textos ou WhatsApp em segundos."
    />
    <meta
      name="keywords"
      content="qrcode, gerador, whatsapp, personalizado, dinamico"
    />
    <meta name="author" content="Alexandre" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://midiadsj.com/qrcode/" />
    <meta property="og:title" content="Gerador de QR Code Premium" />
    <meta
      property="og:description"
      content="Crie códigos QR dinâmicos e personalizados para seus links ou WhatsApp."
    />
    <meta
      property="og:image"
      content="https://midiadsj.com/images/qrcode.png"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://midiadsj.com/qrcode/" />
    <meta property="twitter:title" content="Gerador de QR Code Premium" />
    <meta
      property="twitter:description"
      content="Crie códigos QR dinâmicos e personalizados para seus links ou WhatsApp."
    />
    <meta
      property="twitter:image"
      content="https://midiadsj.com/images/qrcode.png"
    />

    <link rel="canonical" href="https://midiadsj.com/qrcode/" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css?v=1.0.1" />

    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.1/qrcode.min.js"></script>
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4857283046221825"
      crossorigin="anonymous"
    ></script>

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-FD291MZH1Y"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-FD291MZH1Y");
    </script>
  </head>
  <body>
    <div class="background-animation">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
    </div>

    <main class="container">
      <header>
        <div class="logo-icon">QR</div>
        <h1>Gerador de QR Code</h1>
        <p>Crie códigos dinâmicos e vibrantes instantaneamente</p>
      </header>

      <div class="tabs">
        <button type="button" class="tab-btn active" data-tab="url">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
            ></path>
            <path
              d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
            ></path>
          </svg>
          Link ou Texto
        </button>
        <button type="button" class="tab-btn" data-tab="whatsapp">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
            ></path>
          </svg>
          WhatsApp
        </button>
      </div>

      <form id="qr-form" class="glass-panel">
        <div id="url-container" class="tab-content active">
          <div class="input-group full-width">
            <label for="qr-text">Texto ou URL</label>
            <input
              type="text"
              id="qr-text"
              placeholder="https://exemplo.com.br"
              required
            />
          </div>
        </div>

        <div id="whatsapp-container" class="tab-content">
          <div class="settings-grid no-margin">
            <div class="input-group">
              <label for="wa-phone">Número WhatsApp</label>
              <input
                type="tel"
                id="wa-phone"
                placeholder="+55 (11) 99999-9999"
              />
            </div>
            <div class="input-group">
              <label for="wa-message">Mensagem (opcional)</label>
              <input
                type="text"
                id="wa-message"
                placeholder="Olá! Estava no seu site..."
              />
            </div>
          </div>
        </div>

        <div class="settings-grid">
          <div class="input-group">
            <label for="qr-color-dark">Cor do Código</label>
            <div class="color-picker-wrapper">
              <input type="color" id="qr-color-dark" value="#ffffff" />
              <span class="color-value" id="val-dark">#FFFFFF</span>
            </div>
          </div>

          <div class="input-group">
            <label for="qr-color-light">Cor de Fundo</label>
            <div class="color-picker-wrapper transparent-bg">
              <input type="color" id="qr-color-light" value="#000000" />
              <span class="color-value" id="val-light">#000000</span>
            </div>
          </div>

          <div class="input-group full-width">
            <label for="qr-size"
              >Tamanho: <span id="size-label">300</span>px</label
            >
            <input
              type="range"
              id="qr-size"
              min="100"
              max="1000"
              step="50"
              value="300"
            />
          </div>
        </div>

        <button type="submit" class="btn-primary">
          <span>Gerar QR Code</span>
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M5 12h14M12 5l7 7-7 7" />
          </svg>
        </button>
      </form>

      <section id="result-container" class="glass-panel hidden">
        <h2>Seu QR Code</h2>
        <div id="qr-code-wrapper">
          <canvas id="qr-canvas"></canvas>
        </div>
        <button id="download-btn" class="btn-secondary">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"
            />
          </svg>
          <span>Baixar Imagem (PNG)</span>
        </button>
      </section>
    </main>

    <!-- App Logic -->
    <script src="script.js?v=1.0.1"></script>
  </body>
</html>
